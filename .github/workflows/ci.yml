name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit and fixture tests
        run: pytest

      - name: End-to-end release gate
        run: python scripts/e2e_check.py
