name: CI

on:
  push:
  pull_request:

# Least-privilege default for the GITHUB_TOKEN: this workflow only reads
# the repo to test and build - it never needs to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit and fixture tests
        run: pytest

      - name: End-to-end release gate
        run: python scripts/e2e_check.py

      - name: Standalone-executable build smoke test
        run: |
          # Build inside python:3.11-slim-bookworm, same as release.yml -
          # a binary built directly on ubuntu-latest requires a newer
          # glibc than most deployed Linux servers actually have. See
          # release.yml's build step and docs/LEARNINGS.md's 2026-07-29
          # entry for how this was found and verified.
          docker run --rm -v "$PWD":/repo -w /repo python:3.11-slim-bookworm bash -c "
            apt-get -qq update &&
            apt-get -qq install -y binutils &&
            pip install -q '.[build]' &&
            pyinstaller mcp-migration-check.spec --noconfirm
          "
          sudo chown -R "$(id -u):$(id -g)" dist/

          rc=0
          ./dist/mcp-migration-check examples/before || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "expected exit code 1 for examples/before, got $rc"
            exit 1
          fi

          rc=0
          ./dist/mcp-migration-check examples/after || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "expected exit code 0 for examples/after, got $rc"
            exit 1
          fi
