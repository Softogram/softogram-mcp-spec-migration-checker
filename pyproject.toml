[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-migration-check"
version = "0.1.1"
description = "Static analysis CLI that reports what will break in a Python MCP server under the 2026-07-28 MCP spec update."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Softogram" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
mcp-migration-check = "mcp_migration_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_migration_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
